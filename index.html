<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Berra — Legal</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --accent: #0EA5E9;
    --surface: #f1f5f9;
    --border: rgba(15, 23, 42, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070b14;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  main {
    max-width: 520px;
    width: 100%;
    padding: 40px 24px;
    text-align: center;
  }
  h1 {
    font-size: 36px;
    margin: 0 0 8px;
    letter-spacing: -0.8px;
  }
  h1 .dot { color: var(--accent); }
  p.tag {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 40px;
  }
  .links {
    display: grid;
    gap: 12px;
  }
  a.tile {
    display: block;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    transition: transform .12s ease, border-color .12s ease;
  }
  a.tile:hover { transform: translateY(-1px); border-color: var(--accent); }
  a.tile small {
    display: block;
    color: var(--muted);
    font-weight: 400;
    font-size: 13px;
    margin-top: 4px;
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>Berra<span class="dot">.</span></h1>
  <p class="tag">Legal documents</p>
  <div class="links">
    <a href="privacy.html" class="tile">
      Gizlilik Politikası
      <small>Privacy Policy · TR / EN</small>
    </a>
    <a href="terms.html" class="tile">
      Kullanım Koşulları
      <small>Terms of Use · TR / EN</small>
    </a>
  </div>
  <footer>© 2026 Onur Demir</footer>
</main>
</body>
</html>
